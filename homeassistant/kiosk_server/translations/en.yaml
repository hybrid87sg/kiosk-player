configuration:
  superadmin_email:
    name: Spongebob account email
    description: Your Google account. It always has Spongebob access in Kiosk Admin.
  google_web_client_id:
    name: Google web client ID
    description: The "Web application" OAuth client ID from Google Cloud Console (ends in .apps.googleusercontent.com).
  drive_folder_id:
    name: Google Drive folder ID
    description: The ID of the Signage folder, from its web address (drive.google.com/drive/folders/THIS-PART).
  service_account_file:
    name: Service account key file
    description: The name of the key file you copied into this add-on's config folder (addon_configs/local_kiosk_server).
  cache_media:
    name: Keep a local copy of each file
    description: Each file is downloaded from Google Drive once, then sent to every TV from this machine. Uses disk space here.
  transcode_videos:
    name: Make playback copies
    description: After a video arrives, make a 1080p H.264 copy and a 720p fallback so weak TV boxes can play it smoothly. The original in Google Drive is left as it is. Turn this off on a slow machine such as a Raspberry Pi if the add-on becomes unresponsive.
  transcode_4k_hevc:
    name: Also make a 4K HEVC copy
    description: Optional extra copy for a TV box that can decode HEVC and has a 4K screen. This is the slowest copy to make. Leave it off on a Raspberry Pi.
  google_device_client_id:
    name: Web sign-in client ID (optional)
    description: The "TVs and Limited Input devices" OAuth client ID. Lets people sign in to the web page at http://<address>:3000 with a code from google.com/device.
  google_device_client_secret:
    name: Web sign-in client secret (optional)
    description: The secret of that same client.
network:
  3000/tcp: Kiosk server port
