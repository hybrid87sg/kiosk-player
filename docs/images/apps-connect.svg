<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>Connecting the apps: the phone signs in with a username and password; the TV finds the server, or you type an address</title>
  <rect width="760" height="560" rx="14" fill="#F4F8F7"/>

  <!-- Phone: Kiosk Admin sign-in -->
  <rect x="20" y="16" width="268" height="528" rx="32" fill="#0B1211"/>
  <rect x="32" y="28" width="244" height="504" rx="24" fill="#FFFFFF"/>
  <rect x="130" y="44" width="48" height="48" rx="14" fill="#0F766E"/>
  <rect x="142" y="58" width="24" height="16" rx="2" fill="none" stroke="#FFFFFF" stroke-width="2.4"/>
  <text x="154" y="116" font-size="16" fill="#10201E" text-anchor="middle" font-weight="700">Kiosk Admin</text>
  <text x="154" y="134" font-size="10.5" fill="#4A5C59" text-anchor="middle">Choose what plays on every</text>
  <text x="154" y="148" font-size="10.5" fill="#4A5C59" text-anchor="middle">screen, from your phone.</text>

  <text x="48" y="174" font-size="12" fill="#10201E" font-weight="700">Connect to your server</text>
  <text x="48" y="196" font-size="11" fill="#4A5C59">Server address</text>
  <rect x="48" y="202" width="212" height="32" rx="6" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <text x="56" y="223" font-size="8.5" fill="#10201E" font-family="Consolas, Menlo, monospace">homeassistant.tail1234.ts.net:3000</text>

  <text x="48" y="252" font-size="11" fill="#4A5C59">Username</text>
  <rect x="48" y="258" width="212" height="32" rx="6" fill="#FFFFFF" stroke="#7A8C88"/>
  <text x="48" y="308" font-size="11" fill="#4A5C59">Password</text>
  <rect x="48" y="314" width="212" height="32" rx="6" fill="#FFFFFF" stroke="#7A8C88"/>
  <text x="56" y="335" font-size="14" fill="#10201E" letter-spacing="1">••••••••</text>

  <rect x="48" y="356" width="212" height="34" rx="17" fill="#0F766E"/>
  <text x="154" y="378" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="600">Sign in</text>

  <text x="154" y="408" font-size="9.5" fill="#4A5C59" text-anchor="middle">Whoever runs Kiosk makes your username</text>
  <text x="154" y="421" font-size="9.5" fill="#4A5C59" text-anchor="middle">and password, on the Users page.</text>

  <text x="48" y="446" font-size="12" fill="#10201E" font-weight="700">Try the demo</text>
  <text x="154" y="464" font-size="9.5" fill="#4A5C59" text-anchor="middle">Sample files, playlists and players,</text>
  <text x="154" y="476" font-size="9.5" fill="#4A5C59" text-anchor="middle">kept on this phone only.</text>
  <rect x="48" y="486" width="212" height="32" rx="16" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.5"/>
  <text x="154" y="507" font-size="12" fill="#0F766E" text-anchor="middle" font-weight="600">Start demo</text>

  <!-- TV: find the server, or type an address -->
  <rect x="312" y="24" width="424" height="292" rx="10" fill="#0B1211"/>
  <rect x="324" y="36" width="400" height="268" fill="#0E1716"/>
  <text x="524" y="74" font-size="22" fill="#FFFFFF" text-anchor="middle" font-weight="700">Kiosk Player</text>
  <text x="524" y="102" font-size="14" fill="#B8C9C5" text-anchor="middle">How should this screen get its content?</text>

  <rect x="364" y="122" width="320" height="42" rx="21" fill="#5EEAD4"/>
  <text x="524" y="148" font-size="15" fill="#042F2C" text-anchor="middle" font-weight="700">Find my server automatically</text>
  <rect x="364" y="176" width="320" height="42" rx="21" fill="#1E2928"/>
  <text x="524" y="202" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="600">Type the address</text>
  <rect x="364" y="230" width="320" height="42" rx="21" fill="#1E2928"/>
  <text x="524" y="256" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="600">Try the demo</text>

  <rect x="492" y="316" width="64" height="14" fill="#26302F"/>
  <rect x="440" y="330" width="168" height="8" rx="4" fill="#26302F"/>

  <text x="524" y="372" font-size="13" fill="#10201E" text-anchor="middle" font-weight="600">Phone: Tailscale address, then username and password</text>
  <text x="524" y="392" font-size="12.5" fill="#4A5C59" text-anchor="middle">Works at home and away (Tailscale app switched on).</text>
  <text x="524" y="424" font-size="13" fill="#10201E" text-anchor="middle" font-weight="600">TV: Find my server automatically</text>
  <text x="524" y="444" font-size="12.5" fill="#4A5C59" text-anchor="middle">If it finds nothing, Type the address: Settings › System ›</text>
  <text x="524" y="462" font-size="12.5" fill="#4A5C59" text-anchor="middle">Network › IPv4 address, plus :3000. TVs don't need Tailscale.</text>
</svg>
