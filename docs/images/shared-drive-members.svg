<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>Google Drive: add the service account to the Signage shared drive</title>
  <rect width="760" height="430" rx="14" fill="#F4F8F7"/>
  <rect x="20" y="20" width="720" height="390" rx="10" fill="#FFFFFF" stroke="#D3DEDB"/>
  <text x="44" y="62" font-size="20" fill="#10201E" font-weight="600">Manage members of “Signage”</text>

  <rect x="44" y="84" width="470" height="44" rx="6" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <text x="58" y="111" font-size="14" fill="#10201E" font-family="Consolas, Menlo, monospace">kiosk-drive@kiosk-signage.iam.gserviceaccount.com</text>

  <rect x="530" y="84" width="186" height="44" rx="6" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <text x="546" y="111" font-size="15" fill="#10201E">Content manager</text>
  <text x="698" y="111" font-size="13" fill="#4A5C59">▾</text>

  <rect x="44" y="146" width="18" height="18" rx="3" fill="#FFFFFF" stroke="#7A8C88"/>
  <text x="72" y="160" font-size="14" fill="#10201E">Notify people</text>

  <rect x="616" y="182" width="100" height="38" rx="19" fill="#1A73E8"/>
  <text x="666" y="206" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="600">Share</text>

  <line x1="44" y1="240" x2="716" y2="240" stroke="#E1E5EA"/>
  <text x="44" y="268" font-size="13" fill="#4A5C59">Members</text>
  <circle cx="60" cy="300" r="16" fill="#0F766E"/>
  <text x="60" y="305" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="700">Y</text>
  <text x="88" y="297" font-size="14" fill="#10201E">you@yourcompany.com</text>
  <text x="88" y="315" font-size="12.5" fill="#4A5C59">Manager</text>

  <circle cx="300" cy="84" r="0"/>
  <circle cx="44" cy="360" r="15" fill="#C2410C"/>
  <text x="44" y="365" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="700">1</text>
  <text x="68" y="357" font-size="13.5" fill="#10201E" font-weight="600">Paste the service account's email</text>
  <text x="68" y="375" font-size="13" fill="#4A5C59">It's the “robot” the server uses to read and add files.</text>

  <circle cx="440" cy="360" r="15" fill="#C2410C"/>
  <text x="440" y="365" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="700">2</text>
  <text x="464" y="357" font-size="13.5" fill="#10201E" font-weight="600">Choose Content manager</text>
  <text x="464" y="375" font-size="13" fill="#4A5C59">So it can upload and delete files.</text>
</svg>
