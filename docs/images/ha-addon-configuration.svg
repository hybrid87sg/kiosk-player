<svg xmlns="http://www.w3.org/2000/svg" width="760" height="720" viewBox="0 0 760 720" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>Home Assistant: the Kiosk Signage Server add-on's Configuration tab</title>
  <rect width="760" height="720" rx="14" fill="#F4F8F7"/>
  <rect x="20" y="20" width="720" height="680" rx="10" fill="#FFFFFF" stroke="#D3DEDB"/>
  <rect x="20" y="20" width="720" height="50" rx="10" fill="#03A9F4"/>
  <rect x="20" y="54" width="720" height="16" fill="#03A9F4"/>
  <text x="40" y="51" font-size="17" fill="#FFFFFF" font-weight="600">Settings › Add-ons › Kiosk Signage Server</text>

  <text x="44" y="100" font-size="14" fill="#4A5C59">Info</text>
  <text x="106" y="100" font-size="14" fill="#03A9F4" font-weight="700">Configuration</text>
  <rect x="104" y="106" width="104" height="3" fill="#03A9F4"/>
  <text x="232" y="100" font-size="14" fill="#4A5C59">Log</text>
  <text x="280" y="100" font-size="14" fill="#4A5C59">Documentation</text>

  <g font-size="13" fill="#4A5C59">
    <text x="44" y="142">Mode</text>
    <text x="44" y="212">Site name</text>
    <text x="44" y="282">Main server address (relay only)</text>
    <text x="44" y="352">Google Drive folder ID</text>
    <text x="44" y="422">Service account key file (optional)</text>
    <text x="44" y="630">Encoder threads</text>
  </g>

  <g fill="#FFFFFF" stroke="#7A8C88">
    <rect x="44" y="150" width="672" height="38" rx="6"/>
    <rect x="44" y="220" width="672" height="38" rx="6"/>
    <rect x="44" y="290" width="672" height="38" rx="6"/>
    <rect x="44" y="360" width="672" height="38" rx="6"/>
    <rect x="44" y="430" width="672" height="38" rx="6"/>
    <rect x="44" y="638" width="160" height="38" rx="6"/>
  </g>

  <text x="58" y="174" font-size="14.5" fill="#10201E">main</text>
  <text x="692" y="175" font-size="13" fill="#4A5C59" text-anchor="end">▾</text>
  <text x="58" y="454" font-size="14.5" fill="#10201E">service-account.json</text>
  <text x="58" y="662" font-size="14.5" fill="#10201E">1</text>

  <!-- On: knob to the right. Off: gray track, knob to the left. -->
  <g font-size="14" fill="#10201E">
    <rect x="44" y="492" width="40" height="22" rx="11" fill="#03A9F4"/>
    <circle cx="73" cy="503" r="9" fill="#FFFFFF"/>
    <text x="96" y="508">Keep a local copy of each file</text>

    <rect x="44" y="532" width="40" height="22" rx="11" fill="#C5D0CD"/>
    <circle cx="55" cy="543" r="9" fill="#FFFFFF"/>
    <text x="96" y="548">Make playback copies</text>

    <rect x="44" y="572" width="40" height="22" rx="11" fill="#C5D0CD"/>
    <circle cx="55" cy="583" r="9" fill="#FFFFFF"/>
    <text x="96" y="588">Also make a 4K HEVC copy</text>
  </g>

  <rect x="636" y="640" width="80" height="34" rx="6" fill="#03A9F4"/>
  <text x="676" y="662" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="600">Save</text>
</svg>
