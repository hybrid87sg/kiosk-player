<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>Home Assistant: the Kiosk Signage Server add-on's Configuration tab</title>
  <rect width="760" height="520" rx="14" fill="#F4F8F7"/>
  <rect x="20" y="20" width="720" height="480" rx="10" fill="#FFFFFF" stroke="#D3DEDB"/>
  <rect x="20" y="20" width="720" height="50" rx="10" fill="#03A9F4"/>
  <rect x="20" y="54" width="720" height="16" fill="#03A9F4"/>
  <text x="40" y="51" font-size="17" fill="#FFFFFF" font-weight="600">Settings › Add-ons › Kiosk Signage Server</text>

  <text x="44" y="100" font-size="14" fill="#4A5C59">Info</text>
  <text x="106" y="100" font-size="14" fill="#03A9F4" font-weight="700">Configuration</text>
  <rect x="104" y="106" width="104" height="3" fill="#03A9F4"/>
  <text x="232" y="100" font-size="14" fill="#4A5C59">Log</text>
  <text x="280" y="100" font-size="14" fill="#4A5C59">Documentation</text>

  <g font-size="13">
    <text x="44" y="140" fill="#4A5C59">Superadmin email</text>
    <rect x="44" y="148" width="440" height="38" rx="6" fill="#FFFFFF" stroke="#7A8C88"/>
    <text x="58" y="172" font-size="14.5" fill="#10201E">you@yourcompany.com</text>

    <text x="44" y="210" fill="#4A5C59">Google web client ID</text>
    <rect x="44" y="218" width="440" height="38" rx="6" fill="#FFFFFF" stroke="#7A8C88"/>
    <text x="58" y="242" font-size="13" fill="#10201E" font-family="Consolas, Menlo, monospace">123456789-abc…apps.googleusercontent.com</text>

    <text x="44" y="280" fill="#4A5C59">Google Drive folder ID</text>
    <rect x="44" y="288" width="440" height="38" rx="6" fill="#FFFFFF" stroke="#7A8C88"/>
    <text x="58" y="312" font-size="13" fill="#10201E" font-family="Consolas, Menlo, monospace">0AbCdEfGhIjKlMnOpQ…</text>

    <text x="44" y="350" fill="#4A5C59">Service account key file</text>
    <rect x="44" y="358" width="440" height="38" rx="6" fill="#FFFFFF" stroke="#7A8C88"/>
    <text x="58" y="382" font-size="14.5" fill="#10201E">service-account.json</text>

    <rect x="44" y="414" width="40" height="22" rx="11" fill="#03A9F4"/>
    <circle cx="73" cy="425" r="9" fill="#FFFFFF"/>
    <text x="96" y="430" font-size="14" fill="#10201E">Keep a local copy of each file</text>
  </g>

  <rect x="636" y="452" width="80" height="34" rx="6" fill="#03A9F4"/>
  <text x="676" y="474" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="600">Save</text>

  <g font-size="13">
    <circle cx="520" cy="167" r="13" fill="#C2410C"/><text x="520" y="172" fill="#FFFFFF" text-anchor="middle" font-weight="700">1</text>
    <text x="542" y="172" fill="#10201E">The Google account you</text>
    <text x="542" y="188" fill="#10201E">sign in to Kiosk Admin with</text>
    <circle cx="520" cy="237" r="13" fill="#C2410C"/><text x="520" y="242" fill="#FFFFFF" text-anchor="middle" font-weight="700">2</text>
    <text x="542" y="242" fill="#10201E">Web client ID (Part 1)</text>
    <circle cx="520" cy="307" r="13" fill="#C2410C"/><text x="520" y="312" fill="#FFFFFF" text-anchor="middle" font-weight="700">3</text>
    <text x="542" y="312" fill="#10201E">Shared drive ID (Part 2)</text>
    <circle cx="520" cy="377" r="13" fill="#C2410C"/><text x="520" y="382" fill="#FFFFFF" text-anchor="middle" font-weight="700">4</text>
    <text x="542" y="382" fill="#10201E">Key file you copied into</text>
    <text x="542" y="398" fill="#10201E">addon_configs/local_kiosk_server</text>
  </g>
</svg>
