# Builds the two Android apps on GitHub's computers (which have the Android
# tools) every time Android code is pushed. The APK files appear as a
# downloadable "artifact" on the run's page under the repository's Actions tab.
name: Android apps

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test the shared code
        working-directory: android
        run: ./gradlew :core:test

      - name: Build the APKs
        working-directory: android
        run: ./gradlew :admin:assembleDebug :player:assembleDebug

      - name: Give the APKs friendly names
        run: |
          mkdir -p apks
          cp android/admin/build/outputs/apk/debug/admin-debug.apk apks/KioskAdmin.apk
          cp android/player/build/outputs/apk/debug/player-debug.apk apks/KioskPlayer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: kiosk-apks
          path: apks/*.apk
          retention-days: 30
