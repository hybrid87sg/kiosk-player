# Builds the two Android apps on GitHub's computers (which have the Android
# tools) every time Android code is pushed. Each APK appears as its own
# download ("artifact") on the run's page under the repository's Actions tab.
# The "Release" workflow also uses this to build the APKs for a release.
name: Android apps

on:
  push:
    paths:
      - "android/**"
      - "shared/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test the shared code
        working-directory: android
        run: ./gradlew :core:test :admin:testDebugUnitTest

      - name: Build the APKs
        working-directory: android
        run: ./gradlew :admin:assembleDebug :player:assembleDebug

      - name: Give the APKs names that say which device they're for
        run: |
          mkdir -p apks
          cp android/admin/build/outputs/apk/debug/admin-debug.apk apks/KioskAdmin-for-phone.apk
          cp android/player/build/outputs/apk/debug/player-debug.apk apks/KioskPlayer-for-TV.apk

      # Downloads are kept for 3 days: GitHub gives the account a fixed amount of
      # storage, and keeping every push's files for a month filled it. On an
      # ordinary push a failed upload doesn't fail the check (the build itself
      # passed); for a release or a run started by hand it still does, because
      # those need the files.
      - uses: actions/upload-artifact@v4
        continue-on-error: ${{ github.event_name == 'push' }}
        with:
          name: Kiosk-Admin-for-phone
          path: apks/KioskAdmin-for-phone.apk
          retention-days: 3

      - uses: actions/upload-artifact@v4
        continue-on-error: ${{ github.event_name == 'push' }}
        with:
          name: Kiosk-Player-for-TV
          path: apks/KioskPlayer-for-TV.apk
          retention-days: 3
