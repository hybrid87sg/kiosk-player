# Publishes a GitHub release with everything you need:
#   KioskAdmin-for-phone-<version>.apk, KioskPlayer-for-TV-<version>.apk,
#   kiosk_server-addon-<version>.zip and the Windows Kiosk Browser installer
#   (KioskBrowser-Setup-<version>.exe). Every file name carries the release's version,
#   so a downloaded file shows which release it came from.
#
# How: Actions tab -> "Release" -> "Run workflow", type a version (e.g. 0.4.0).
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 0.2.0"
        required: true
      prerelease:
        description: "Mark it as a test version (pre-release)"
        type: boolean
        default: true

permissions:
  contents: write # needed to create the release
  packages: write # needed to upload the ready-built add-on

jobs:
  # Tests the add-on and publishes it ready-built (ghcr.io) for Home Assistant.
  addon:
    uses: ./.github/workflows/addon.yml
    with:
      publish: true

  # Builds the two apps and the add-on zip here and attaches them straight to
  # the release. Nothing passes through GitHub's "artifact" storage on the way,
  # so a full artifact store can't stop a release.
  publish:
    needs: [addon]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test the shared code
        working-directory: android
        run: ./gradlew :core:test :admin:testDebugUnitTest

      - name: Build the APKs
        working-directory: android
        run: ./gradlew :admin:assembleDebug :player:assembleDebug

      - name: Put the release files together (each name carries the version)
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p files
          cp android/admin/build/outputs/apk/debug/admin-debug.apk "files/KioskAdmin-for-phone-$VERSION.apk"
          cp android/player/build/outputs/apk/debug/player-debug.apk "files/KioskPlayer-for-TV-$VERSION.apk"
          bash homeassistant/package-addon.sh
          cp homeassistant/dist/kiosk_server-addon.zip "files/kiosk_server-addon-$VERSION.zip"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Kiosk Signage v${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ inputs.prerelease }}
          fail_on_unmatched_files: true
          files: |
            files/KioskAdmin-for-phone-${{ inputs.version }}.apk
            files/KioskPlayer-for-TV-${{ inputs.version }}.apk
            files/kiosk_server-addon-${{ inputs.version }}.zip
          body: |
            ## Which file goes where
            | File | Goes on | What it is |
            |---|---|---|
            | `KioskAdmin-for-phone-${{ inputs.version }}.apk` | Your Android phone | Kiosk Admin app |
            | `KioskPlayer-for-TV-${{ inputs.version }}.apk` | Each Android TV box | Kiosk Player app |
            | `KioskBrowser-Setup-${{ inputs.version }}.exe` | A Windows PC with a touch screen | Kiosk Browser: signage when idle, your web page on touch |
            | `kiosk_server-addon-${{ inputs.version }}.zip` | Home Assistant | The server, as an add-on, for installing by hand. The easy way is the add-on repository: https://github.com/hybrid87sg/kiosk-addons |

            Both apps have a **Demo mode** with sample data, so they can be tried
            without a server. Connecting to the real server needs the add-on running
            and the one-time Google setup.

            The apps are test builds signed with the shared test key in `android/keystore`.

  # The Windows installer, built on Windows and added to the release made above.
  windows:
    needs: [publish]
    uses: ./.github/workflows/windows.yml
    with:
      release_tag: v${{ inputs.version }}
